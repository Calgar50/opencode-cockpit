# Banc du plugin de garde (L24, T-L24-a et T-L24-b) : opencode 1.18.30 RÉEL, SANS l'extension, avec le seul filet du cockpit, et
# le faux fournisseur de la salle (L21a, mode --http) lancé par le pilote. Aucune IA réelle, aucun appel facturé, aucun jeton
# Copilot, aucun secret : le mot de passe d'opencode est tiré par le test à chaque exécution et passé par l'environnement.
#
# Lancé par app/server/omo-guard.test.ts (OMO_TESTS_CONTENEUR=1) depuis une copie de ce fichier dans un dossier temporaire, à côté
# de config/, vide/, guard/ et banc/ : les chemins relatifs ci-dessous désignent cette copie, jamais le dépôt. Projet omo11-l24,
# images :omo11 déjà construites (aucune construction, aucun tirage), réseau interne, aucun port publié.
#
# Dossiers de configuration en LECTURE SEULE (F-aa, spéc. l.183) : un dossier de configuration inscriptible ferait installer
# @opencode-ai/plugin par opencode avant de charger le moindre plugin. Le plugin est monté en lecture seule, au chemin du contrat.
# Chacun de ces dossiers porte un `.gitignore` (posé par le test) : sans lui, opencode 1.18.30 tente de l'écrire, reçoit EROFS et
# refuse d'ouvrir le moindre projet (HTTP 500 à chaque requête) — mesuré sur ce banc le 19/09 (L24.md).
name: omo11-l24

networks:
  interne:
    internal: true

volumes:
  # /control du cockpit : écrit par le pilote seul (comme par le cockpit), monté en lecture seule dans opencode.
  controle: {}
  # /workspace : le projet ouvert, préparé par le pilote (liens compris, que Windows ne sait pas poser sur un montage).
  travail: {}

services:
  opencode:
    image: omo11/opencode:omo11
    pull_policy: never
    # Ni superviseur du cockpit (il écrit dans /control et dans la configuration), ni entrée de l'image : opencode seul, sous tini.
    entrypoint: ["tini", "--", "opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096", "--print-logs", "--log-level", "INFO"]
    working_dir: /workspace
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /home/node:exec,mode=0755,uid=1000,gid=1000
      - /tmp:exec,mode=1777
    environment:
      HOME: /home/node
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?mot de passe tire par omo-guard.test.ts}
      OPENCODE_CONFIG_DIR: /etc/opencode-l24
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      TZ: UTC
    volumes:
      - { type: bind, source: ./config, target: /etc/opencode-l24, read_only: true }
      - { type: bind, source: ./vide, target: /home/node/.config/opencode, read_only: true }
      - { type: bind, source: ./vide, target: /home/node/.opencode, read_only: true }
      - { type: bind, source: ./vide, target: /home/node/.omo, read_only: true }
      - { type: bind, source: ./vide, target: /home/node/.claude, read_only: true }
      - { type: bind, source: ./vide, target: /home/node/.agents, read_only: true }
      - { type: bind, source: ./guard/cockpit-guard.js, target: /opt/omo-guard/cockpit-guard.js, read_only: true }
      - { type: volume, source: controle, target: /control, read_only: true }
      - { type: volume, source: travail, target: /workspace }
    networks: [interne]

  # Pilote : faux fournisseur (API sur banc:8080, pilotage en boucle locale) et scénarios ; rapport JSON sur la sortie standard.
  banc:
    image: omo11/app:omo11
    pull_policy: never
    entrypoint: ["node", "/banc/run-guard.mjs"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?mot de passe tire par omo-guard.test.ts}
      OPENCODE_URL: http://opencode:4096
      # Contre-épreuve sans filet : sous-ensemble des scénarios (vide = tous).
      BANC_SCENARIOS: ${BANC_SCENARIOS:-}
      TZ: UTC
    volumes:
      - { type: bind, source: ./banc, target: /banc, read_only: true }
      - { type: volume, source: controle, target: /control }
      # Sur /data (à node dans l'image du pilote), pas sur /workspace (à root) : MO-11, le dernier conteneur créé fixe le propriétaire.
      - { type: volume, source: travail, target: /data }
    networks: [interne]
