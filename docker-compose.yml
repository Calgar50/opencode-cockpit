# opencode-cockpit : ne modifiez pas ce fichier, personnalisez `.env` (généré par install.ps1).
#
# Salle Oh My OpenAgent (services `opencode-omo`, `egress` et `omo-init`) : tous sous le profil `omo`, donc absents tant que
# `--profile omo` n'est pas donné. Trois règles mesurées (MX-OMO) valent pour qui touche à ce fichier :
#   1. RÉPÉTER `--profile omo` pour `stop` et pour `down` (MO-3 point 2) : sans lui, la salle continue de tourner et le réseau du
#      projet ne peut pas être supprimé (« Resource is still in use »). `cockpit.ps1` le fait ; à la main, ne l'oubliez pas.
#   2. JAMAIS de variable EXIGÉE (forme deux-points point d'interrogation) dans un service à profil (MO-3 point 1) : elle casse
#      `config`, `up`, `stop` et `down` du projet ENTIER, profil inactif compris — une installation sans la salle ne pourrait même
#      plus arrêter son cockpit. D'où la valeur d'office `…:absente` de l'image de la salle : sans le profil tout marche, et avec
#      le profil une image absente donne une erreur nette, grâce à `pull_policy: never`.
#   3. Ne pas mélanger `COMPOSE_PROFILES` et `--profile` (MO-3 point 3) : donnés ensemble, `--profile` remplace la variable.
name: opencode-cockpit

x-network-env: &network-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  # Le trafic interne (cockpit <-> opencode) ne doit jamais passer par le proxy d'entreprise.
  NO_PROXY: localhost,127.0.0.1,::1,opencode,cockpit${NO_PROXY:+,${NO_PROXY}}
  COCKPIT_TLS_INSECURE: ${COCKPIT_TLS_INSECURE:-0}
  # 1 = autorise la configuration .opencode/ des dépôts (plugins compris). Désactivée par défaut.
  COCKPIT_PROJECT_CONFIG: ${COCKPIT_PROJECT_CONFIG:-0}
  COCKPIT_GITHUB_ENTERPRISE_DOMAIN: ${COCKPIT_GITHUB_ENTERPRISE_DOMAIN:-}
  TZ: ${TZ:-Europe/Paris}

# Journaux des conteneurs plafonnés (le journal d'opencode y est recopié en continu).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-build-args: &build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  COCKPIT_TLS_INSECURE: ${COCKPIT_TLS_INSECURE:-0}

services:
  opencode:
    image: ${COCKPIT_OPENCODE_IMAGE:-opencode-cockpit/opencode:local}
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
      args: *build-args
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      <<: *network-env
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Lancez install.ps1 pour générer le fichier .env}
    volumes:
      - ${WORKSPACE_DIR:?WORKSPACE_DIR manquant dans .env}:/workspace
      - oc-config:/home/node/.config/opencode
      - oc-data:/home/node/.local/share/opencode
      - oc-cache:/home/node/.cache/opencode
      - control:/control
      - ./certs:/certs:ro
    # Aucun port publié : opencode n'est joignable que par le cockpit.
    expose: ["4096"]

  cockpit:
    image: ${COCKPIT_APP_IMAGE:-opencode-cockpit/app:local}
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        <<: *build-args
        # Numéro affiché dans l'interface (fichier VERSION, écrit dans .env par install.ps1).
        COCKPIT_VERSION: ${COCKPIT_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Démarré sans attendre la santé d'opencode : l'interface reste accessible (état, diagnostic, liste des IA
    # lue directement chez GitHub Copilot) même quand opencode ne répond pas.
    depends_on:
      opencode:
        condition: service_started
    environment:
      <<: *network-env
      # Les deux services de la salle rejoignent le trafic interne : le cockpit les appelle en direct, jamais par le proxy.
      NO_PROXY: localhost,127.0.0.1,::1,opencode,cockpit,opencode-omo,egress${NO_PROXY:+,${NO_PROXY}}
      NODE_USE_ENV_PROXY: "1"
      COCKPIT_HOST: 0.0.0.0
      COCKPIT_PORT: "7777"
      COCKPIT_TOKEN: ${COCKPIT_TOKEN:?Lancez install.ps1 pour générer le fichier .env}
      COCKPIT_ALLOWED_HOSTS: ${COCKPIT_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      COCKPIT_LOCAL_SCHEME: ${COCKPIT_LOCAL_SCHEME:-https}
      COCKPIT_LOCAL_HTTP_CONFIRMED: ${COCKPIT_LOCAL_HTTP_CONFIRMED:-}
      # Fournisseurs d'IA acceptés (liste séparée par des virgules). Toute autre valeur = mode test, bandeau rouge.
      COCKPIT_ALLOWED_PROVIDERS: ${COCKPIT_ALLOWED_PROVIDERS:-github-copilot}
      # Adresse d'API Copilot imposée (pare-feu à routage par abonnement). Vide : adresse d'office d'opencode, ou celle
      # de l'abonnement annoncée par GitHub quand le réseau bloque la première.
      COCKPIT_COPILOT_API_URL: ${COCKPIT_COPILOT_API_URL:-}
      # 1.1 : « off » coupe les choix d'autonomie automatiques (Modifications automatiques, Autonome avec contrôle).
      COCKPIT_AUTONOMY: ${COCKPIT_AUTONOMY:-on}
      COCKPIT_HOST_WORKSPACE_DIR: ${WORKSPACE_DIR}
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      # --- Salle Oh My OpenAgent (variables `cockpit` du contrat docker/opencode-omo/contrat-salle.json) ---
      # « off » d'office : la salle reste coupée tant qu'install.ps1 -OmoArchive n'a pas été lancé ET que ce réglage n'a pas été
      # mis à « on » à la main. Aucune de ces variables ne démarre quoi que ce soit : le service est derrière son profil.
      COCKPIT_OMO: ${COCKPIT_OMO:-off}
      COCKPIT_OMO_IMAGE: ${COCKPIT_OMO_IMAGE:-}
      OPENCODE_OMO_URL: http://opencode-omo:4096
      OPENCODE_OMO_PASSWORD: ${OPENCODE_OMO_PASSWORD:-}
      COCKPIT_OMO_CONTROL_DIR: /control-omo
      COCKPIT_OMO_STATE_DIR: /omo-state
      COCKPIT_OMO_AUTH_DIR: /omo-auth
      # SOURCE de la liste des projets préparés, jamais sa destination : le cockpit la relit ici, la normalise et la dépose dans
      # `COCKPIT_OMO_CONTROL_DIR` sous le nom du contrat. Les deux chemins doivent rester DIFFÉRENTS : égaux, `publishProjects()`
      # lirait le fichier qu'il vient d'écrire — absent sur une installation neuve — et retirerait la seule copie existante.
      # Le fichier est écrit sur l'hôte par install.ps1 et monté ici, en lecture seule, par `docker-compose.omo-projets.yml`.
      COCKPIT_OMO_PROJECTS_FILE: /omo-source/omo-projets.json
      COCKPIT_EGRESS_JOURNAL: /egress-log
    volumes:
      - ${WORKSPACE_DIR}:/workspace
      - ${ARCHIVE_DIR:-./archives}:/archives
      - cockpit-data:/data
      - cockpit-tls:/tls
      - oc-config:/oc-config
      - oc-data:/oc-data:ro
      - control:/control
      - ./certs:/certs:ro
      # Salle : le cockpit écrit le battement, le stop-request, les projets préparés et l'authentification réduite ; il ne fait
      # que LIRE l'état publié par le superviseur et le journal des sorties refusées (contrat, `volumes[].ecrivain`).
      - control-omo:/control-omo
      - omo-auth:/omo-auth
      - omo-state:/omo-state:ro
      - egress-log:/egress-log:ro
    # Uniquement sur la boucle locale ; HTTPS par défaut, HTTP seulement après install.ps1 -Http
    ports: ["127.0.0.1:${COCKPIT_PORT:-7777}:7777"]
    # `omo-internal` est fermé (internal: true) : le rejoindre n'ouvre rien vers l'extérieur, et c'est le seul chemin vers la salle.
    networks: [default, omo-internal]

  # --- Salle Oh My OpenAgent (profil `omo`) ---------------------------------------------------------------------------------
  # Préparation des volumes de la salle, puis arrêt (MO-11). Sous Compose, le propriétaire d'un volume neuf est celui du point de
  # montage dans l'image du service créé en DERNIER, pas du premier démarré : il ne se déduit pas de l'ordre. Ce service jetable le
  # pose donc explicitement, avant `opencode-omo`, d'après `volumes[].proprietaire` du contrat. Le superviseur vérifie ensuite
  # chaque propriétaire et REFUSE de démarrer en cas d'écart, sans rien corriger en silence.
  omo-init:
    profiles: ["omo"]
    image: ${COCKPIT_APP_IMAGE:-opencode-cockpit/app:local}
    restart: "no"
    logging: *logging
    read_only: true
    # Root le temps du chown, sans aucune autre capacité (CHOWN seule) et sans réseau du tout.
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    pids_limit: 32
    network_mode: none
    # Commande fixe, sans aucune entrée : les six chemins sont ceux que app/Dockerfile crée pour ce service.
    entrypoint: ["/bin/sh", "-c"]
    command: ["set -eu; chown node:node /control-omo /omo-auth /egress-log /oc-omo-data; chown root:root /omo-state /omo-config"]
    volumes:
      - control-omo:/control-omo
      - omo-auth:/omo-auth
      - egress-log:/egress-log
      - oc-omo-data:/oc-omo-data
      - omo-state:/omo-state
      - omo-config:/omo-config

  # Proxy de sortie de la salle : seul `CONNECT <hôte de l'API Copilot>:443` passe, tout le reste reçoit 403 et entre au journal.
  # Membre des DEUX réseaux (MO-10 point 5) : c'est la seule forme qui donne une sortie à un réseau `internal: true`.
  egress:
    profiles: ["omo"]
    # Image du cockpit, autre commande, zéro dépendance npm : elle est déjà construite ou chargée par le service `cockpit`.
    image: ${COCKPIT_APP_IMAGE:-opencode-cockpit/app:local}
    command: ["node", "--disable-warning=ExperimentalWarning", "server/egress-proxy.ts"]
    restart: unless-stopped
    logging: *logging
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    # L'image porte le HEALTHCHECK du cockpit (server/healthcheck.ts) : sans cette surcharge, `egress` ne serait JAMAIS sain.
    healthcheck:
      test: ["CMD", "node", "--disable-warning=ExperimentalWarning", "server/egress-proxy.ts", "--sonde"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    environment:
      # HTTPS_PROXY : proxy d'entreprise de l'hôte, auquel egress chaîne son CONNECT. Il est seul à le voir.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,opencode,cockpit,opencode-omo,egress${NO_PROXY:+,${NO_PROXY}}
      COCKPIT_COPILOT_API_URL: ${COCKPIT_COPILOT_API_URL:-}
      COCKPIT_GITHUB_ENTERPRISE_DOMAIN: ${COCKPIT_GITHUB_ENTERPRISE_DOMAIN:-}
      COCKPIT_EGRESS_JOURNAL: /egress-log
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - egress-log:/egress-log
    networks: [default, omo-internal]

  # Seconde instance d'opencode, avec l'extension Oh My OpenAgent. Image apportée en archive (P13) : jamais construite, jamais tirée.
  opencode-omo:
    profiles: ["omo"]
    image: ${COCKPIT_OMO_IMAGE:-opencode-cockpit/opencode-omo:absente}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    read_only: true
    # Syntaxe COURTE imposée (MO-4 point 3) : la syntaxe longue (`type: tmpfs`) n'accepte ni `exec`, ni `uid`/`gid`, et le HOME y
    # appartiendrait à root. `exec` est nécessaire : un tmpfs Docker est `noexec` d'office, et le lanceur de tests d'un projet ne
    # partirait pas depuis /tmp (MO-4 points 1 et 2). Attention : `noexec` n'empêche de toute façon pas `sh /tmp/script.sh`.
    # Le troisième tmpfs donne à opencode un dossier d'état inscriptible : sous le HOME, Docker crée les dossiers INTERMÉDIAIRES
    # des montages (~/.local, ~/.local/share) en root 755, et `node` ne peut alors plus créer ~/.local/state (MO-3 point 8).
    tmpfs:
      - "/home/node:exec,mode=0755,uid=1000,gid=1000"
      - "/tmp:exec,mode=1777"
      - "/home/node/.local/state:exec,mode=0755,uid=1000,gid=1000"
    # SETUID et SETGID : le superviseur démarre root (manifeste, validation, état) et bascule vers `node` par setpriv (D-2b-27).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    # Ajustés au train de la vague 3 d'après la mesure M22 du banc hors ligne (L21, extension 4.19.4 chargée) : 347,8 Mio de
    # mémoire au maximum, 11 processus, 4,37 % de CPU. Les plafonds provisoires de D-2b-46 (512 / 2 / 4g) étaient larges d'un
    # facteur ≈ 10. La marge reste volontairement grande — une tâche réelle charge plus qu'un faux fournisseur.
    pids_limit: 128
    cpus: 2
    mem_limit: 1g
    depends_on:
      omo-init:
        condition: service_completed_successfully
    # Liste blanche `variables.salle` du contrat, et elle seule : ni l'ancre `network-env` (elle porte des réglages du cockpit),
    # ni `env_file` (il verserait tout le .env dans la salle).
    environment:
      # Tout le trafic sortant passe par egress, qui n'ouvre que CONNECT vers l'API Copilot ; le proxy d'entreprise n'est atteignable
      # que par lui. Le réseau étant fermé, une requête qui contournerait ces variables n'irait nulle part (MO-10 points 1 et 2).
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,::1,egress
      OPENCODE_SERVER_USERNAME: opencode
      # Mot de passe propre à la salle, jamais celui de l'instance principale ; install.ps1 l'écrit dans .env et le cockpit reçoit
      # le même. Variable exigée impossible ici (MO-3 point 1) : c'est au démarrage de la salle de refuser une valeur vide.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_OMO_PASSWORD:-}
      # Jamais vide : validate.mjs refuse de démarrer sans adresse d'API bien formée (demande (C) de L15a).
      COCKPIT_COPILOT_API_URL: ${COCKPIT_COPILOT_API_URL:-https://api.githubcopilot.com}
      # Autorité d'entreprise facultative : chemin d'un fichier DANS le conteneur (par exemple /certs/entreprise.pem).
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    volumes:
      # Sessions de la salle, sans configuration. `oc-data` (instance principale) n'est JAMAIS monté ici (D-2b-26) : la salle ne
      # reçoit que l'entrée `github-copilot` d'auth.json, recopiée par le cockpit dans `omo-auth`.
      - oc-omo-data:/home/node/.local/share/opencode
      - omo-auth:/auth-src:ro
      - control-omo:/control:ro
      - omo-state:/omo-state
      # Configuration figée : un seul volume, monté en écriture hors du HOME (root y pose omo.jsonc et .gitignore à chaque
      # démarrage) et en lecture seule sur les cinq dossiers que lisent l'extension et opencode (D-2b-33, révisée au train de V1).
      - omo-config:/omo-config
      - omo-config:/home/node/.config/opencode:ro
      - omo-config:/home/node/.opencode:ro
      - omo-config:/home/node/.omo:ro
      - omo-config:/home/node/.claude:ro
      - omo-config:/home/node/.agents:ro
      - ${WORKSPACE_DIR}:/workspace
      - ./certs:/certs:ro
    # Aucun port publié : la salle n'est joignable que par le cockpit, sur le réseau fermé.
    expose: ["4096"]
    networks: [omo-internal]

volumes:
  oc-config:
  oc-data:
  oc-cache:
  cockpit-data:
  cockpit-tls:
  control:
  # Salle (contrat docker/opencode-omo/contrat-salle.json, `volumes`).
  control-omo:
  omo-auth:
  omo-state:
  egress-log:
  oc-omo-data:
  omo-config:

networks:
  default:
  # Réseau fermé de la salle : aucune route par défaut, aucune résolution publique, aucune sortie (MO-10 points 1 et 2). Seuls
  # `cockpit` et `egress` y ont un pied, et `egress` est le seul à toucher aussi le réseau ouvert. `opencode` n'y entre jamais (P11).
  omo-internal:
    internal: true
