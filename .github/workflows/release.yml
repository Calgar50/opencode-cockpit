name: Release

# Publie les images sur GHCR et une archive « docker save » en pièce jointe de la release,
# pour les postes qui ne peuvent ni construire ni tirer d'images (install.ps1 -Mode Load).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version et propriétaire
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Le tag v$tag ne correspond pas au fichier VERSION ($file)." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image opencode
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/opencode/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/opencode-cockpit-opencode:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/opencode-cockpit-opencode:latest

      - name: Image app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COCKPIT_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/opencode-cockpit-app:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/opencode-cockpit-app:latest

      - name: Archive des images
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          oc="ghcr.io/$OWNER/opencode-cockpit-opencode:$VERSION"
          app="ghcr.io/$OWNER/opencode-cockpit-app:$VERSION"
          docker pull "$oc"
          docker pull "$app"
          archive="opencode-cockpit-images-$VERSION.tar.gz"
          docker save "$oc" "$app" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          ls -lh "$archive"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            opencode-cockpit-images-*.tar.gz
            opencode-cockpit-images-*.tar.gz.sha256
