name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Application (types, tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # Les tests du HTTPS local se sautent d'eux-memes quand openssl manque (developpement sous Windows) :
      # en CI, il est exige, et son absence fait echouer la suite au lieu de la sauter en silence.
      COCKPIT_TEST_REQUIRE_OPENSSL: "1"
      COCKPIT_OPENSSL: /usr/bin/openssl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm test
      # Tests qui demandent un conteneur Linux jetable : hors de npm test, ils ne tournent qu'ici et en local.
      # L'image de base est tiree ici : le test ne telecharge jamais rien lui-meme, il se saute si elle manque.
      - name: Superviseur (conteneur)
        if: ${{ !cancelled() }}
        env:
          OMO_TESTS_CONTENEUR: "1"
        run: |
          docker pull -q node:24-bookworm-slim
          node --test server/omo-supervisor.test.ts
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    name: Images Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image opencode
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/opencode/Dockerfile
          push: false
          tags: opencode-cockpit/opencode:ci
      - name: Image app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/Dockerfile
          push: false
          # Chargee dans le demon : le test de fumee la lance vraiment (deux modes, droits, couches, contexte).
          load: true
          tags: opencode-cockpit/app:ci
      - name: Test de fumee HTTPS de l'image app
        run: bash .github/ci/https-smoke.sh opencode-cockpit/app:ci

  windows-ps51:
    name: Scripts PowerShell 5.1 (Windows)
    runs-on: windows-2025
    # Une confirmation qui attendrait une console ne doit pas bloquer le job pendant des heures.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Regles statiques (Validate-Scripts.ps1)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ps51/Validate-Scripts.ps1
      # Chaque suite s'execute meme si la precedente echoue : le rapport reste complet.
      - name: Bibliotheque CockpitTls.ps1 (Test-CockpitTls.ps1)
        if: ${{ !cancelled() }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ps51/Test-CockpitTls.ps1
      - name: install.ps1 (Test-Install.ps1)
        if: ${{ !cancelled() }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ps51/Test-Install.ps1
      - name: cockpit.ps1 (Test-Cockpit.ps1)
        if: ${{ !cancelled() }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ps51/Test-Cockpit.ps1
      - name: Installation de la salle (Test-OmoInstall.ps1)
        if: ${{ !cancelled() }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ps51/Test-OmoInstall.ps1
